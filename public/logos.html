<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SubKill — mark options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#06060f; --field1:#0d0b22; --field2:#120d2e;
    --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.2);
    --glass:rgba(255,255,255,.05);
    --t:#fff; --t2:#b6b2d4; --t3:#7d78a0;
    --mint:#4ff5c0; --mintd:#17d9a0; --violet:#a78bfa; --violetd:#7c5cff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--void);color:var(--t);
    font-family:Inter,-apple-system,sans-serif;font-size:14.5px;
    -webkit-font-smoothing:antialiased;min-height:100vh;padding:28px 18px 60px;
  }
  body::before{
    content:'';position:fixed;inset:-20%;z-index:0;pointer-events:none;
    background:
      radial-gradient(38% 30% at 18% 8%, rgba(124,58,237,.5) 0%, transparent 62%),
      radial-gradient(34% 28% at 86% 14%, rgba(23,217,160,.3) 0%, transparent 62%),
      radial-gradient(44% 34% at 62% 88%, rgba(56,84,240,.36) 0%, transparent 62%),
      linear-gradient(168deg,var(--field2) 0%,var(--field1) 42%,var(--void) 100%);
    filter:blur(28px);
  }
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.04em;
     font-size:clamp(26px,6vw,38px);margin:0 0 8px;line-height:1.05}
  .sub{color:var(--t2);margin:0 0 6px;max-width:60ch}
  .hint{color:var(--t3);font-size:12.5px;margin:0 0 30px}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
  .opt{
    background:linear-gradient(158deg,rgba(255,255,255,.1),rgba(255,255,255,.035));
    border:1px solid var(--line);border-radius:20px;padding:22px;
    box-shadow:0 2px 6px rgba(0,0,0,.3),0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);
    backdrop-filter:blur(24px) saturate(170%);
  }
  .num{font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:800;
       letter-spacing:.16em;color:var(--t3);text-transform:uppercase}
  .name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;
        letter-spacing:-.025em;margin-top:3px}
  .idea{color:var(--t3);font-size:11.5px;margin-top:4px;line-height:1.45}
  .stage{display:flex;align-items:center;gap:22px;margin:20px 0 14px;flex-wrap:wrap}
  .lock{display:flex;align-items:center;gap:10px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
  .wm{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:-.035em;font-size:19px}
  .sizes{display:flex;align-items:center;gap:14px}
  .cap{font-size:10px;color:var(--t3);text-align:center;margin-top:5px}
  .sq{width:46px;height:46px;border-radius:12px;background:var(--field1);
      display:grid;place-items:center;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pick a mark</h1>
  <p class="sub">Six directions for SubKill, each on the real app background at the sizes that matter: large, nav size, and favicon size.</p>
  <p class="hint">Tell me the number. I'll wire it through the app, the favicon and the welcome screen.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const G = (id) => `
  <linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#4ff5c0"/><stop offset="100%" stop-color="#17d9a0"/>
  </linearGradient>
  <linearGradient id="${id}b" x1="1" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c5cff"/>
  </linearGradient>
  <linearGradient id="${id}c" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c5cff"/><stop offset="55%" stop-color="#4ff5c0"/><stop offset="100%" stop-color="#4ff5c0"/>
  </linearGradient>`;

/* Each mark is a function of (size, unique id) returning SVG markup. */
const MARKS = [
  {
    name: 'Broken chain',
    idea: 'Two links of a recurring commitment; one is open. Reads as breaking the chain of payments.',
    svg: (s, id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><defs>${G(id)}</defs>
      <rect x="3.4" y="11.2" width="15" height="9.6" rx="4.8" stroke="url(#${id}a)" stroke-width="3"/>
      <path d="M18.2 11.2h5.6a4.8 4.8 0 0 1 4.8 4.8 4.8 4.8 0 0 1-4.8 4.8h-2.2" stroke="url(#${id}b)" stroke-width="3" stroke-linecap="round"/>
    </svg>`
  },
  {
    name: 'Flatline',
    idea: 'A repeating payment pulse that stops dead. The most literal reading of the name.',
    svg: (s, id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><defs>${G(id)}</defs>
      <path d="M2 16h4l2.4-6.4L11.6 22l2.6-9.4 2.2 6" stroke="url(#${id}b)" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19.4 16H30" stroke="url(#${id}a)" stroke-width="2.9" stroke-linecap="round"/>
    </svg>`
  },
  {
    name: 'Cut coin',
    idea: 'A coin with a wedge removed. Money, and something taken out of it on purpose.',
    svg: (s, id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><defs>${G(id)}
      <mask id="${id}m"><rect width="32" height="32" fill="#fff"/>
        <path d="M16 16 L34 4 L34 18 Z" fill="#000"/></mask></defs>
      <circle cx="16" cy="16" r="11" stroke="url(#${id}a)" stroke-width="3.2" mask="url(#${id}m)"/>
      <path d="M16 16 L27.2 8.6" stroke="url(#${id}b)" stroke-width="3.2" stroke-linecap="round"/>
    </svg>`
  },
  {
    name: 'Descending stack',
    idea: 'Three recurring charges, each smaller than the last. Spend coming down, month on month.',
    svg: (s, id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><defs>${G(id)}</defs>
      <rect x="3" y="5" width="26" height="6" rx="3" fill="url(#${id}b)"/>
      <rect x="3" y="13.4" width="18" height="6" rx="3" fill="url(#${id}c)" opacity=".85"/>
      <rect x="3" y="21.8" width="9" height="6" rx="3" fill="url(#${id}a)"/>
    </svg>`
  },
  {
    name: 'Guard cut',
    idea: 'A shield, opened by a diagonal cut. Protection plus the act of cancelling.',
    svg: (s, id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><defs>${G(id)}</defs>
      <path d="M16 3.2 27 7v8.4c0 6.6-4.6 11.2-11 13.4" stroke="url(#${id}b)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 3.2 5 7v8.4c0 3.1 1 5.9 2.7 8.2" stroke="url(#${id}a)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.6 26.4 20.4 16" stroke="url(#${id}a)" stroke-width="3" stroke-linecap="round"/>
    </svg>`
  },
  {
    name: 'Severed cycle',
    idea: 'The current mark: the recurring loop, cut on the diagonal and slipped apart.',
    svg: (s, id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><defs>${G(id)}</defs>
      <g transform="rotate(-38 16 16)">
        <circle cx="16" cy="16" r="10" stroke="url(#${id}a)" stroke-width="3.7" stroke-linecap="round"
                stroke-dasharray="25.6 62.83" transform="translate(-1.35 0)"/>
        <circle cx="16" cy="16" r="10" stroke="url(#${id}b)" stroke-width="3.7" stroke-linecap="round"
                stroke-dasharray="25.6 62.83" stroke-dashoffset="-31.4" transform="translate(1.35 0)"/>
      </g>
    </svg>`
  },
];

document.getElementById('grid').innerHTML = MARKS.map((m, i) => `
  <div class="opt">
    <div class="num">Option ${i + 1}</div>
    <div class="name">${m.name}</div>
    <div class="idea">${m.idea}</div>
    <div class="stage">
      ${m.svg(88, 'x' + i)}
      <div class="sizes">
        <div><div class="sq">${m.svg(26, 'y' + i)}</div><div class="cap">nav</div></div>
        <div><div class="sq" style="width:34px;height:34px;border-radius:9px">${m.svg(18, 'z' + i)}</div><div class="cap">favicon</div></div>
      </div>
    </div>
    <div class="lock">${m.svg(28, 'w' + i)}<span class="wm">SubKill</span></div>
  </div>
`).join('');
</script>
</body>
</html>
